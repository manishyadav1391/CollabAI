services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabai
      POSTGRES_PASSWORD: collabai
      POSTGRES_DB: collabai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local-dev broker. Not required once REDIS_URL in .env points
  # at Redis Cloud — kept here as a fallback: point REDIS_URL back at
  # redis://redis:6379/0 to use it again.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local-dev object store. Not required once STORAGE_ENDPOINT_URL
  # in .env points at Backblaze B2 — kept here as a fallback: point
  # STORAGE_ENDPOINT_URL back at http://localhost:9000 (for the host-run
  # API) to use it again. Note the worker container can't resolve
  # "localhost" back to the host, so switching the worker to this container
  # needs its own override, e.g. `STORAGE_ENDPOINT_URL: http://minio:9000`
  # under worker.environment below (removed now that the default is Backblaze,
  # where the same public URL works for both host and container).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: collabai_minio
      MINIO_ROOT_PASSWORD: change-me-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m app.workers.worker_main
    env_file:
      - .env
    environment:
      # Override host-facing values from .env with in-network service names —
      # the worker never serves browser-facing URLs (unlike the API's
      # presigned upload/download URLs), so it's free to talk to services
      # by name. STORAGE_ENDPOINT_URL and REDIS_URL are left as-is from
      # .env: whether that's MinIO/local redis or Backblaze/Redis Cloud,
      # it's the same URL for host and container.
      DATABASE_URL: postgresql+asyncpg://collabai:collabai@postgres:5432/collabai
    volumes:
      - ./backend:/app
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  hf-cache: